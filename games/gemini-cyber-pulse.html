<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER PULSE</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05050f;
            font-family: monospace;
            color: #fff;
        }

        #canvas-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #030308;
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 5, 15, 0.95);
            z-index: 10;
            transition: opacity 0.15s;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3.5rem;
            font-style: italic;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #ff007f;
            margin-bottom: 10px;
            text-align: center;
        }

        p.sub {
            font-size: 1rem;
            color: #8899cc;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
            text-align: center;
        }

        .btn {
            background: #ff0055;
            border: 2px solid #ff88cc;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 16px 48px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        .btn:hover {
            background: #ff1a6c;
            transform: scale(1.05);
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        #hud.hidden {
            display: none;
        }

        .progress-wrap {
            width: 400px;
            max-width: 50vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            width: 0%;
            height: 100%;
            background: #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        .bar-txt {
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #d0e0ff;
        }
    </style>
</head>

<body>
    <div id="canvas-wrap">
        <canvas id="gameCanvas"></canvas>

        <!-- MAIN MENU -->
        <div id="screen-menu" class="screen">
            <h1>CYBER PULSE</h1>
            <p class="sub">Press Space, Up Arrow, W, or Click to Jump</p>
            <button class="btn" id="btn-play">PLAY LEVEL</button>
        </div>

        <!-- GAMEOVER -->
        <div id="screen-death" class="screen hidden">
            <h1 style="color: #ff0055; text-shadow: 0 0 20px #ff0055;">CRASHED</h1>
            <p id="txt-death" class="sub" style="color: #ff88aa;">Progress: 0%</p>
            <button class="btn" id="btn-retry">TRY AGAIN</button>
        </div>

        <!-- COMPLETE -->
        <div id="screen-complete" class="screen hidden">
            <h1 style="color: #00ffff;">VICTORY!</h1>
            <p class="sub">Level Completed Successfully</p>
            <button class="btn" id="btn-menu">PLAY AGAIN</button>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="progress-wrap">
                <div class="bar-txt">CYBER START (SUPER JUMP MODE)</div>
                <div class="bar-bg">
                    <div class="bar-fill" id="bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- STABLE AUDIO SYNTHESIZER ---
        class Synth {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            tone(f1, f2, dur, type, vol) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const t = this.ctx.currentTime;
                    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(10, f2), t + dur);
                    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur);
                } catch (e) { }
            }
            jump() { this.tone(300, 750, 0.1, 'sine', 0.25); }
            crash() { this.tone(150, 40, 0.25, 'sawtooth', 0.25); }
        }
        const audio = new Synth();

        // --- GAME ENGINE ---
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d', { alpha: false });
                this.state = 'MENU';

                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.jumpRequested = false;
                this.setupInputs();

                this.player = { x: 100, y: 400, vy: 0, size: 36, grounded: false, rot: 0 };
                this.speed = 2.6; // Relaxed speed
                this.length = 4000;
                this.objects = [];
                this.buildLevel();
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                this.canvas.width = this.width * dpr;
                this.canvas.height = this.height * dpr;
                this.canvas.style.width = this.width + 'px';
                this.canvas.style.height = this.height + 'px';
                this.ctx.scale(dpr, dpr);
            }

            setupInputs() {
                const triggerJump = (e) => {
                    audio.init();
                    this.jumpRequested = true;
                    if (e) e.preventDefault();
                };

                window.addEventListener('keydown', e => {
                    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                        if (!e.repeat) triggerJump(e);
                    }
                });
                this.canvas.addEventListener('pointerdown', triggerJump);
            }

            buildLevel() {
                this.objects = [];
                const gY = 540;
                let x = 600;

                // Extra wide, highly dodgeable spacing
                while (x < this.length - 400) {
                    const pattern = Math.floor(Math.random() * 3);
                    if (pattern === 0) {
                        this.objects.push({ type: 'SPIKE', x, y: gY });
                        x += 520; // Massive gap
                    } else if (pattern === 1) {
                        this.objects.push({ type: 'SPIKE', x, y: gY });
                        this.objects.push({ type: 'SPIKE', x: x + 60, y: gY });
                        x += 600;
                    } else {
                        this.objects.push({ type: 'BLOCK', x, y: gY - 110, w: 200, h: 35 });
                        this.objects.push({ type: 'SPIKE', x: x + 80, y: gY - 150 });
                        x += 650;
                    }
                }
            }

            start() {
                audio.init();
                this.player.x = 100;
                this.player.y = 400;
                this.player.vy = 0;
                this.player.grounded = false;
                this.player.rot = 0;

                this.state = 'PLAYING';
                document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
                document.getElementById('hud').classList.remove('hidden');
            }

            die() {
                if (this.state !== 'PLAYING') return;
                audio.crash();
                this.state = 'GAMEOVER';
                const pct = Math.min(100, Math.floor((this.player.x / this.length) * 100));
                document.getElementById('txt-death').innerText = `Progress: ${pct}%`;
                document.getElementById('screen-death').classList.remove('hidden');
                document.getElementById('hud').classList.add('hidden');
            }

            complete() {
                this.state = 'COMPLETE';
                document.getElementById('screen-complete').classList.remove('hidden');
                document.getElementById('hud').classList.add('hidden');
            }

            update() {
                if (this.state !== 'PLAYING') return;

                const p = this.player;
                p.x += this.speed;
                const gY = 540;

                // Floatier, higher jump gravity
                p.vy += 0.48;
                p.y += p.vy;

                // Ground collision
                if (p.y >= gY - p.size / 2) {
                    p.y = gY - p.size / 2;
                    p.vy = 0;
                    p.grounded = true;
                    p.rot = Math.round(p.rot / 90) * 90;
                } else {
                    p.grounded = false;
                    p.rot += 3.0;
                }

                // Higher, powerful jump boost
                if (this.jumpRequested && p.grounded) {
                    p.vy = -13.5;
                    p.grounded = false;
                    audio.jump();
                }
                this.jumpRequested = false;

                // Forgiving Hitboxes
                for (let o of this.objects) {
                    if (Math.abs(o.x - p.x) > 400) continue;

                    if (o.type === 'SPIKE') {
                        if (p.x + p.size / 4 > o.x - 12 && p.x - p.size / 4 < o.x + 12 &&
                            p.y + p.size / 4 > o.y - 24 && p.y - p.size / 4 < o.y) {
                            this.die();
                        }
                    } else if (o.type === 'BLOCK') {
                        if (p.x + p.size / 2.2 > o.x && p.x - p.size / 2.2 < o.x + o.w &&
                            p.y + p.size / 2.2 > o.y && p.y - p.size / 2.2 < o.y + o.h) {
                            if (p.vy >= 0 && p.y - p.size / 2 <= o.y + 10) {
                                p.y = o.y - p.size / 2;
                                p.vy = 0;
                                p.grounded = true;
                            } else {
                                this.die();
                            }
                        }
                    }
                }

                if (p.x >= this.length) {
                    this.complete();
                }

                document.getElementById('bar-fill').style.width = Math.min(100, (p.x / this.length) * 100) + '%';
            }

            render() {
                const ctx = this.ctx, w = this.width, h = this.height;
                ctx.fillStyle = '#040410';
                ctx.fillRect(0, 0, w, h);

                const camX = this.player.x - w * 0.25;

                // Floor grid
                ctx.strokeStyle = '#00ffff22';
                ctx.lineWidth = 1.5;
                const gY = 540;
                ctx.beginPath();
                ctx.moveTo(0, gY); ctx.lineTo(w, gY);
                for (let x = -camX % 60; x < w; x += 60) {
                    ctx.moveTo(x, gY); ctx.lineTo(x, h);
                }
                ctx.stroke();

                ctx.save();
                ctx.translate(-camX, 0);

                // Draw objects
                for (let o of this.objects) {
                    if (Math.abs(o.x - this.player.x) > w) continue;

                    if (o.type === 'SPIKE') {
                        ctx.fillStyle = '#ff0055';
                        ctx.beginPath();
                        ctx.moveTo(o.x, o.y - 32);
                        ctx.lineTo(o.x - 16, o.y);
                        ctx.lineTo(o.x + 16, o.y);
                        ctx.fill();
                    } else if (o.type === 'BLOCK') {
                        ctx.fillStyle = '#101838';
                        ctx.strokeStyle = '#00ffff';
                        ctx.lineWidth = 2;
                        ctx.fillRect(o.x, o.y, o.w, o.h);
                        ctx.strokeRect(o.x, o.y, o.w, o.h);
                    }
                }

                // Draw Player
                const p = this.player;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rot * Math.PI) / 180);
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                ctx.restore();
            }

            loop() {
                this.update();
                this.render();
                requestAnimationFrame(() => this.loop());
            }
        }

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            const game = new Game();

            document.getElementById('btn-play').onclick = () => game.start();
            document.getElementById('btn-retry').onclick = () => game.start();
            document.getElementById('btn-menu').onclick = () => {
                document.getElementById('screen-complete').classList.add('hidden');
                document.getElementById('screen-menu').classList.remove('hidden');
                game.state = 'MENU';
            };

            requestAnimationFrame(() => game.loop());
        });
    </script>
</body>

</html>
