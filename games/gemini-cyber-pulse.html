const ACTION={
  PLAY:1,LEVELS:2,SETTINGS:3,CUSTOMIZE:4,SHOP:5,BACK:6,HELP:7,
  LEVEL0:10,INFINITY:15,RESUME:30,RESTART:31,PRACTICE:32,EXIT:33,NEXT:34,
  PAUSE_BTN:35,CHECKPOINT_BTN:36,CHECKPOINT_DEL:37,
  MUSIC:40,SFX:41,MUTE:42,SHAKE:43,MOTION:44,RESET_SETTINGS:45,UNLOCK_ALL:46,
  SLIDER_MUSIC:140,SLIDER_SFX:141,ICON:50,PALETTE0:60,SAVE_LOOK:70,SHOP0:80
};

class UIMap{constructor(){this.rect=new Float32Array(64*4);this.action=new Int16Array(64);this.variant=new Uint8Array(64);this.labels=new Array(64).fill('');this.count=0;this.hover=-1;}addButton(x,y,w,h,label,action,variant){let i=this.count;if(i>=64)return -1;this.rect[i*4]=x;this.rect[i*4+1]=y;this.rect[i*4+2]=w;this.rect[i*4+3]=h;this.action[i]=action;this.variant[i]=variant;this.labels[i]=label;this.count++;return i;}hit(x,y){for(let i=this.count-1;i>=0;i--){const k=i*4;if(x>=this.rect[k]&&x<=this.rect[k]+this.rect[k+2]&&y>=this.rect[k+1]&&y<=this.rect[k+1]+this.rect[k+3])return i;}return -1;}}

class Game {
 constructor(canvas){

 }
 bindEvents(){const c=this.canvas;
  c.addEventListener('pointerdown',e=>{
    e.preventDefault();c.setPointerCapture?.(e.pointerId);this.renderer.resizeIfNeeded();

    const hit=this.ui.hit(x,y);
    if(hit>=0){
      const action=this.ui.action[hit];
      if(action===ACTION.SLIDER_MUSIC||action===ACTION.SLIDER_SFX)this.dragSlider=action;
      this.activate(action,x,y);return;
    }
    if(this.state===GAME_STATES.PLAYING){
      this.input.held=true;this.input.pressed=true;this.input.pressX=x;this.input.pressY=y;

  });
  c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*this.renderer.W,y=(e.clientY-r.top)/r.height*720;if(this.dragSlider){this.activate(this.dragSlider,x,y);return;}const h=this.ui.hit(x,y);if(h!==this.ui.hover){this.ui.hover=h;if(h>=0)this.audio.sfx('hover');}});

  window.addEventListener('keydown',e=>{
    const key=e.code;
    if(['Space','ArrowUp','KeyW','ArrowDown'].includes(key))e.preventDefault();
    if(this.runtimeFault&&key==='KeyR'){this.runtimeFault=null;this.startLevel(this.levelIndex);return;}
    if(!e.repeat){this.audio.unlock();this.audio.resume();}
    if(key==='F3'){Settings.debug=!Settings.debug;return;}
    if(key==='KeyM'){Settings.muted=!Settings.muted;this.audio.setMute(Settings.muted);Storage.save();return;}
    if(key==='Escape'||key==='Backspace'){
      if(this.state===GAME_STATES.PLAYING)this.setState(GAME_STATES.PAUSED);
      else if(this.state===GAME_STATES.PAUSED)this.setState(GAME_STATES.PLAYING);
      else if([GAME_STATES.LEVELS,GAME_STATES.SETTINGS,GAME_STATES.CUSTOMIZE,GAME_STATES.SHOP,GAME_STATES.HELP].includes(this.state))this.setState(GAME_STATES.MENU);
      return;
    }
    if(key==='KeyP'&&this.state===GAME_STATES.PLAYING){this.practice=!this.practice;if(this.practice)this.practiceNotice=1.7;Storage.save();return;}
    if(key==='KeyC'&&this.state===GAME_STATES.PLAYING){this.placeCheckpoint();return;}
    if(key==='KeyX'&&this.state===GAME_STATES.PLAYING&&this.practice){this.removeCheckpoint();return;}
    if(['Space','ArrowUp','KeyW'].includes(key)){
      if(!this.input.held)this.input.pressed=true;this.input.held=true;
      if(this.state===GAME_STATES.BOOT)this.setState(GAME_STATES.MENU);
      else if(this.state===GAME_STATES.MENU)this.startLevel(0);
      else if(this.state===GAME_STATES.PAUSED)this.setState(GAME_STATES.PLAYING);
      else if(this.state===GAME_STATES.DEATH)this.restartRun(true);

  });
  window.addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){this.input.held=false;this.input.released=true;}});
  window.addEventListener('blur',()=>{this.input.held=false;});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){this.hidden=true;cancelAnimationFrame(this.raf);this.audio.suspend();this.last=0;this.acc=0;}
    else{this.hidden=false;this.last=0;this.acc=0;this.audio.resume();this.audio.nextTime=this.audio.ctx?this.audio.ctx.currentTime+.05:0;this.raf=requestAnimationFrame(this.rafCallback);}
  });
  window.addEventListener('resize',()=>this.renderer.resize());
  c.addEventListener('contextlost',e=>{e.preventDefault();this.runtimeFault='Canvas context was lost';this.audio.stopMusic();});
  c.addEventListener('contextrestored',()=>{try{this.renderer.ctx=c.getContext('2d',{alpha:false,desynchronized:true});this.renderer.skies.length=0;this.renderer.buildAssets();this.renderer.resize();this.runtimeFault=null;this.last=0;this.acc=0;}catch(err){this.runtimeFault=String(err);}});
 }
 setState(s){if(this.state===s)return;this.state=s;this.stateTimer=0;this.ui.hover=-1;if(s===GAME_STATES.PAUSED){this.input.held=false;this.musicStartStep=this.audio.step;this.audio.stopMusic();}if(s===GAME_STATES.MENU||s===GAME_STATES.LEVELS||s===GAME_STATES.SETTINGS||s===GAME_STATES.CUSTOMIZE||s===GAME_STATES.SHOP||s===GAME_STATES.HELP){this.audio.stopMusic();}if(s===GAME_STATES.PLAYING){if(!this.audio.running&&this.audio.ctx)this.audio.startMusic(LEVELS[this.levelIndex].bpm,LEVELS[this.levelIndex].root,this.musicStartStep||0);} }
 start(){this.last=0;this.raf=requestAnimationFrame(this.rafCallback);}
 startLevel(index){index=clamp(index,0,5);this.levelIndex=index;const def=LEVELS[index];this.world.compile(def,index);this.levelEndX=this.world.endX;this.currentSpeed=1;this.theme=def.theme;this.oldTheme=this.theme;this.themeBlend=1;this.themeTimer=0;this.practice=Settings.practiceDefault;this.checkpoint.active=false;this.deaths=0;this.progress=0;this.newBest=false;this.rewardCoins=0;this.infinityScore=0;this.simTime=0;this.runTime=0;this.player.x=0;this.player.y=FLOOR-this.player.size/2;this.player.prevY=this.player.y;this.player.vy=0;this.player.mode=def.mode;this.player.grav=1;this.player.size=PLAYER_SIZE;this.player.baseSize=PLAYER_SIZE;this.player.rotation=0;this.player.grounded=true;this.player.coyote=2;this.player.buffer=0;this.player.squashX=1;this.player.squashY=1;this.player.held=false;this.player.trailClock=0;this.player.morph=0;this.fx.reset();this.beatPulse=0;this.cameraPunch=0;this.input.held=false;this.input.pressed=false;this.input.released=false;this.practiceNotice=0;this.modeTipMode=def.mode;this.modeTipTimer=2.4;this.portalTipTimer=0;this.portalTipText="";this.musicStartStep=0;this.audio.startMusic(def.bpm,def.root,0);this.setState(GAME_STATES.PLAYING);announce('Started '+def.name);}
 activate(a,x,y){
  this.audio.sfx('click');
  if(a>=ACTION.LEVEL0&&a<=ACTION.INFINITY){this.startLevel(a-ACTION.LEVEL0);return;}
  if(a>=ACTION.PALETTE0&&a<ACTION.PALETTE0+5){Storage.data.palette=a-ACTION.PALETTE0;this.theme=Storage.data.palette;Storage.save();return;}
  if(a>=ACTION.SHOP0&&a<ACTION.SHOP0+3){const i=a-ACTION.SHOP0;if(Storage.data.unlocked[i+1])return;const cost=[60,80,100][i];if(Storage.data.coins>=cost){Storage.data.coins-=cost;Storage.data.unlocked[i+1]=true;Storage.data.palette=(i+1)%5;Storage.save();}return;}

    case ACTION.SHOP:this.setState(GAME_STATES.SHOP);break;
    case ACTION.HELP:this.returnToPause=this.state===GAME_STATES.PAUSED;this.setState(GAME_STATES.HELP);break;
    case ACTION.BACK:if(this.returnToPause){this.returnToPause=false;this.setState(GAME_STATES.PAUSED);}else this.setState(this.state===GAME_STATES.PAUSED?GAME_STATES.PLAYING:GAME_STATES.MENU);break;

    case ACTION.RESTART:this.restartRun(false);break;
    case ACTION.PRACTICE:this.practice=!this.practice;if(this.practice)this.practiceNotice=1.7;break;
    case ACTION.EXIT:this.setState(GAME_STATES.MENU);break;
    case ACTION.NEXT:if(this.levelIndex<4)this.startLevel(this.levelIndex+1);else this.startLevel(5);break;
    case ACTION.PAUSE_BTN:this.setState(GAME_STATES.PAUSED);break;

    case ACTION.SFX:Settings.sfx=Settings.sfx>.5?.25:.75;this.audio.setSfx(Settings.sfx);Storage.save();break;
    case ACTION.MUTE:Settings.muted=!Settings.muted;this.audio.setMute(Settings.muted);Storage.save();break;
    case ACTION.UNLOCK_ALL:Settings.unlockAll=!Settings.unlockAll;Storage.save();break;
    case ACTION.SHAKE:Settings.shake=Settings.shake>.4?0:1;Storage.save();break;
